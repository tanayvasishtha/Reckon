[project]
name = "reckon"
version = "0.1.0"
description = "Accounts payable exception agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx",
    "pandas",
    "pydantic",
    "pyyaml",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = false
